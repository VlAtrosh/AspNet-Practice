<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета практика</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button:hover {
                background: #2980b9;
            }

        .success {
            color: green;
            margin-top: 15px;
        }

        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Анкета</h1>
    <form id="anketaForm">
        <label for="firstName">Имя:</label>
        <input type="text" id="firstName" name="firstName" required>

        <label for="lastName">Фамилия:</label>
        <input type="text" id="lastName" name="lastName" required>

        <label for="age">Возраст:</label>
        <input type="number" id="age" name="age" min="1" max="120" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="about">О себе:</label>
        <textarea id="about" name="about" rows="3"></textarea>

        <button type="submit">Отправить заявку</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('anketaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));

            try {
                const response = await fetch('/api/anketa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const resultDiv = document.getElementById('result');

                if (response.ok) {
                    resultDiv.innerHTML = `<p class="success"> ${result.message}</p>`;
                    form.reset();
                } else {
                    resultDiv.innerHTML = `<p class="error"> ${result.error}</p>`;
                }
            } catch (err) {
                document.getElementById('result').innerHTML = `<p class="error">Ошибка: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
